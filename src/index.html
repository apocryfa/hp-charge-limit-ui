<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HP Charge Limit</title>
<style>
  :root{
    --bg:#0e1116;
    --win-top:#131922;
    --win-bot:#0f141a;
    --panel:#161c24;
    --panel-hi:#1c2430;
    --line:#252d39;
    --fg:#e6edf3;
    --muted:#93a0af;
    --dim:#5d6979;
    --accent:#2fd3a8;
    --accent-soft:#2fd3a822;
    --track:#080b10;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:radial-gradient(120% 90% at 50% -10%,#151c26 0%,var(--bg) 60%);
    color:var(--fg);
    font:14px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
    padding:22px;
  }
  .window{
    width:960px;
    display:flex;flex-direction:column;
    background:linear-gradient(180deg,var(--win-top),var(--win-bot));
    border:1px solid var(--line);
    border-top:0;
    border-radius:18px;
    box-shadow:0 28px 70px -24px #000,inset 0 1px 0 #ffffff0a;
    overflow:hidden;
  }

  /* ---------- titlebar ---------- */
  .titlebar{
    display:flex;align-items:center;gap:10px;
    padding:13px 16px;
    margin-top:11px;
    border-bottom:0;
    background:#11171f;
    position:relative;
  }
  .titlebar::before,.titlebar::after{content:"";position:absolute;left:0;right:150px;height:1px}  .titlebar::before{top:1px;height:1px;background:#6b7a8f}  .titlebar::after{bottom:0;background:#6b7a8f}  .dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft),0 0 10px #2fd3a866;
    flex:none;
  }
  .title{font-weight:600;font-size:13.5px;letter-spacing:.2px}
  .titlebar .sep{color:var(--dim);font-size:12px}
  .sub{color:var(--dim);font-size:12px}
  .pill{
    margin-left:auto;
    font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--dim);
    border:1px solid var(--line);border-radius:999px;
    padding:3px 9px;
    white-space:nowrap;
  }

  /* ---------- layout ---------- */
  .content{padding:12px 16px 4px;display:flex;gap:14px;align-items:flex-start}  .right-col{display:flex;flex-direction:column;gap:4px;flex:1}
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px 15px 12px;
  }
  .card h2{
    margin:0 0 11px;
    font-size:10.5px;font-weight:600;
    letter-spacing:.15em;text-transform:uppercase;
    color:var(--dim);
  }
  .card.battery{grid-column:1 / -1}  /* unused, kept for compat */
  .bat-block{
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid var(--line);
  }

  /* ---------- manual: 3 modes ---------- */
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .seg-btn{
    appearance:none;
    display:flex;flex-direction:column;align-items:flex-start;gap:2px;
    padding:10px 11px;
    font:inherit;color:var(--muted);text-align:left;
    background:var(--panel-hi);
    border:1px solid var(--line);
    border-radius:10px;
    cursor:default;
    transition:border-color .15s,color .15s,background .15s;
  }
  .seg-btn .name{font-size:13px;font-weight:600;color:#cbd5e1}
  .seg-btn .hint{font-size:10.5px;color:var(--dim);line-height:1.3}
  .seg-btn:hover{border-color:#33404f}
  .seg-btn.is-on{
    background:linear-gradient(180deg,#15342d,#122a25);
    border-color:#2c8f76;
    box-shadow:inset 0 1px 0 #ffffff10,0 0 0 1px #2fd3a81f;
  }
  .seg-btn.is-on .name{color:#8ff0d6}
  .seg-btn.is-on .hint{color:#4f9c86}

  /* ---------- service ---------- */
  .svc-row{display:flex;align-items:center;gap:12px}
  .svc-name{font-size:13px;font-weight:600;color:#cbd5e1}
  .svc-meta{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
  .switch{margin-left:auto;position:relative;display:inline-flex;flex:none;cursor:default}
  .switch input{
    position:absolute;inset:0;width:100%;height:100%;
    opacity:0;margin:0;cursor:default;
  }
  .slider{
    display:block;width:44px;height:24px;border-radius:999px;
    background:#0b0f14;border:1px solid var(--line);
    position:relative;transition:background .15s,border-color .15s;
  }
  .slider::after{
    content:"";position:absolute;top:3px;left:3px;
    width:16px;height:16px;border-radius:50%;
    background:#7d8896;transition:transform .15s,background .15s;
  }
  .switch input:checked + .slider{
    background:#143c33;border-color:#2c8f76;
  }
  .switch input:checked + .slider::after{
    transform:translateX(20px);background:var(--accent);
    box-shadow:0 0 10px #2fd3a877;
  }
  .svc-state{
    margin-top:11px;padding-top:10px;border-top:1px solid var(--line);
    font-size:12px;color:var(--muted);
  }
  .svc-state.plain{border-top:0;padding-top:0;margin-top:0;}
  .svc-state b{color:#8ff0d6;font-weight:600}
  .svc-state span{color:var(--dim);font-variant-numeric:tabular-nums}

  /* ---------- battery scale ---------- */
  .bat-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
  .pct{
    font-size:34px;font-weight:300;line-height:1;
    letter-spacing:-1px;
    font-variant-numeric:tabular-nums;
    color:#f2f7fa;
  }
  .pct .sym{font-size:16px;color:var(--dim);margin-left:2px;letter-spacing:0}
  .pct.is-stale .num{color:var(--dim)}
  .bat-right{display:flex;align-items:baseline;gap:12px}
  .bat-state{
    font-size:11px;color:var(--muted);letter-spacing:.04em;
    text-transform:uppercase;
  }
  .bat-state:empty{display:none}
  .note{
    margin-top:10px;font-size:11px;line-height:1.4;color:var(--dim);
  }
  .note:empty{display:none}
  .note.err{color:#d98c8c}
  .scale{position:relative}
  .track{
    position:relative;height:16px;
    background:var(--track);
    border:1px solid #1d2531;
    border-radius:8px;
    overflow:hidden;
  }
  /* minor ticks every 5% */
  .track::before{
    content:"";position:absolute;inset:0;z-index:2;
    background:repeating-linear-gradient(90deg,#ffffff0d 0 1px,transparent 1px 5%);
  }
  /* major ticks every 25% */
  .track::after{
    content:"";position:absolute;inset:0;z-index:3;
    background:repeating-linear-gradient(90deg,#ffffff1f 0 1.5px,transparent 1.5px 25%);
  }
  .fill{
    position:absolute;top:0;left:0;bottom:0;z-index:1;
    width:54%;
    background:linear-gradient(90deg,#1c6f5d,#2fd3a8 70%,#63f0cd);
    box-shadow:0 0 18px #2fd3a855;
    border-radius:7px 0 0 7px;
  }
  .fill::after{ /* bright leading edge */
    content:"";position:absolute;top:0;bottom:0;right:0;width:2px;
    background:#b8fff0;box-shadow:0 0 8px #63f0cd;
  }
  .labels{
    display:flex;justify-content:space-between;
    margin-top:7px;
    font-size:10.5px;color:var(--dim);
    font-variant-numeric:tabular-nums;
  }

  /* ---------- footer ---------- */
  .footer{
    display:flex;align-items:center;gap:8px;
    padding:6px 16px 8px;
    border-top:1px solid var(--line);
    background:#0c1117;
    font-size:11px;color:var(--dim);
  }
  .footer .warn{color:#b08a4a}

  /* ---------- app shell (Electron only) ---------- */
  .is-electron body{padding:0;background:var(--bg)}
  .is-electron .window{
    width:100%;min-height:0;
    border-radius:0;
    border-left:0;border-right:0;border-bottom:0;
    box-shadow:none;
  }
  .is-electron .titlebar{
    -webkit-app-region:drag;
    padding-right:150px; /* clear the native window buttons */
  }
</style>
</head>
<body>
  <div class="window">

    <div class="titlebar">
      <span class="dot" aria-hidden="true"></span>
      <span class="title">HP Charge Limit</span>
      <span class="sep">·</span>
      <span class="sub">hp-charge-limit-rs</span>
    </div>

    <div class="content">

      <!-- 1. MANUAL -->
      <section class="card" aria-labelledby="h-manual" style="flex:1">
        <h2 id="h-manual">Manual</h2>
        <div class="seg" role="group" aria-label="Manual charge mode">
          <button class="seg-btn" type="button" id="mode-auto" data-mode="auto" aria-pressed="false">
            <span class="name">Auto</span>
            <span class="hint">no cap</span>
          </button>
          <button class="seg-btn" type="button" id="mode-inhibit" data-mode="inhibit" aria-pressed="false">
            <span class="name">Inhibit</span>
            <span class="hint">charging paused</span>
          </button>
          <button class="seg-btn" type="button" id="mode-hold" data-mode="hold" aria-pressed="false">
            <span class="name">Hold</span>
            <span class="hint">survives shutdown</span>
          </button>
        </div>
        <div class="note" id="mode-note"></div>

        <div class="bat-block">
          <div class="bat-head">
            <span class="bat-state" id="bat-state"></span>
            <div class="pct is-stale" id="pct"><span class="num">--</span><span class="sym">%</span></div>
          </div>
          <div class="scale">
            <div class="track" role="img" aria-label="Battery level" id="track">
              <div class="fill" id="fill" style="width:0%"></div>
            </div>
            <div class="labels">
              <span>0</span><span>25</span><span>50</span><span>75</span><span>100%</span>
            </div>
          </div>
          <div class="note" id="bat-rate"></div>
        </div>
      </section>

      <!-- 2. SERVICE -->
      <div class="right-col">
      <section class="card" aria-labelledby="h-service">
        <h2 id="h-service">Service</h2>
        <div class="svc-row">
          <div>
            <div class="svc-name">Daemon</div>
            <div class="svc-meta">poll 30 s · stop 50% · start 40%</div>
          </div>
          <label class="switch" title="Enable / disable the service">
            <input type="checkbox" id="svc-toggle" checked aria-label="Service enabled">
            <span class="slider" aria-hidden="true"></span>
          </label>
        </div>
        <div class="svc-state">Status: <b id="svc-word">—</b> <span id="svc-extra"></span></div>
        <div class="svc-row" style="margin-top:10px">
          <div>
            <div class="svc-name">Full charge bypass</div>
            <div class="svc-meta">until reboot · bypass on/off</div>
          </div>
          <label class="switch" title="Bypass the charge limit until reboot">
            <input type="checkbox" id="bypass-toggle" aria-label="Full charge bypass">
            <span class="slider" aria-hidden="true"></span>
          </label>
        </div>
        <div class="note" id="svc-note"></div>
      </section>

      <!-- 3. BATTERY (removed — meter is now inside the Manual card) -->

      <!-- 4. STATUS -->
      <section class="card">
        <h2>Status</h2>
        <div class="svc-state plain">
          <span class="warn" id="msg-kind">local</span>
          <span id="msg">connecting to daemon…</span>
        </div>
      </section>

      </div>

    </div>

  </div>
  <script src="renderer.js"></script>
</body>
</html>
